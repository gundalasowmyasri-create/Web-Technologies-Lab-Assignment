<!DOCTYPE html>
<html>
<head>
<title>Job Registration</title>

<style>
.container{
    padding:10px;
    border:2px solid black;
    margin:20px;
    width:350px;
}

h2{
    color:blue;
    text-align:center;
}

p{
    font-size:18px;
    color:red;
}
</style>

</head>

<body>

<center>

<div class="container">

<h2>Job Registration</h2>

<label>Name</label>
<input type="text" id="name"><br><br>

<label>Email ID</label>
<input type="text" id="emailid"><br><br>

<label>Contact No</label>
<input type="text" id="contactno"><br><br>

<button onclick="validateform()">Register</button>

<p id="msg"></p>

</div>

</center>

<script>

function validateform(){

var name=document.getElementById("name").value.trim();
var emailid=document.getElementById("emailid").value.trim();
var contactno=document.getElementById("contactno").value.trim();

// Regular Expressions
var nameregx=/^[A-Za-z][A-Za-z0-9]{2,19}$/;
var emailidregx=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
var contactnoregx=/^[6-9][0-9]{9}$/;

if(!nameregx.test(name))
{
    document.getElementById("msg").innerHTML="Invalid Name";
    document.getElementById("msg").style.color="red";
    return;
}

if(!emailidregx.test(emailid))
{
    document.getElementById("msg").innerHTML="Invalid Email ID";
    document.getElementById("msg").style.color="red";
    return;
}

if(!contactnoregx.test(contactno))
{
    document.getElementById("msg").innerHTML="Invalid Contact Number";
    document.getElementById("msg").style.color="red";
    return;
}

document.getElementById("msg").innerHTML="Registration Successful";
document.getElementById("msg").style.color="green";

}

</script>

</body>
</html>
